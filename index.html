<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Oatmeal Morning</title>
<meta name="description" content="Oatmeal Morning is a small studio making apps we actually use. Home of OCD: Off, Closed, Done and SK8.">
<meta property="og:type" content="website">
<meta property="og:title" content="Oatmeal Morning">
<meta property="og:description" content="A small studio making apps we actually use.">
<meta property="og:url" content="https://oatmealmorning.com/">
<link rel="stylesheet" href="/site.css">
<style>
.studio{min-height:100svh;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-top:40px}
.logo{width:120px;height:120px;margin:0 auto 14px;display:block}
.wordmark{font-size:38px;margin-top:8px;font-weight:700;letter-spacing:-.01em;margin:0}
.tagline{margin:8px auto 0;color:var(--muted);font-weight:600;max-width:320px;text-wrap:balance}
.cards{display:grid;gap:16px;margin:36px auto 0;max-width:420px;width:100%}
@media (min-width:600px){.cards{grid-template-columns:1fr 1fr;max-width:560px}}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px 20px;border-radius:12px;background:var(--bg);border:2px solid transparent;box-shadow:var(--shadow);color:var(--ink);font-weight:500;transition:background .18s,border-color .18s,transform .1s}
a.card:hover{background:var(--lavender);border-color:var(--accent);text-decoration:none}
a.card:active{transform:scale(.99)}
.card .art{width:72px;height:72px;object-fit:contain}
.card .name{font-weight:700;font-size:19px;line-height:1.2}
.card .what{color:var(--muted);font-size:14px;font-weight:600;margin:0}
.card .go{display:inline-flex;align-items:center;gap:5px;margin-top:4px;background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.card.soon{cursor:default}
.card.sk8{background:#23222E;color:#fff;border-color:transparent;box-shadow:0 2px 12px rgba(20,20,40,.25)}
.card.sk8 .art{width:92px;height:92px;object-fit:contain}
.card.sk8 .name{font-size:24px;letter-spacing:.04em}
.card.sk8 .s{color:#7EE8D0}.card.sk8 .k{color:#A8F0C8}.card.sk8 .e{color:#F58BB8}
.card.sk8 .what{color:#C9C7D6}
.card.sk8 .go{background:#FFD24A;color:#1F1F22}
.studio footer{justify-content:center;margin-top:44px}
</style>
</head>
<body>
<main class="page studio">
  <h1 class="wordmark">Oatmeal Morning</h1>
  <p class="tagline">A small studio making apps we actually use.</p>

  <div class="cards">
    <a class="card" href="https://ocd.oatmealmorning.com/">
      <img class="art" src="/ocd-icon.png" alt="">
      <span class="name">OCD: Off, Closed, Done</span>
      <p class="what">The checklist for anyone who gets halfway down the street wondering if they locked the door.</p>
      <span class="go">Open the app &rarr;</span>
    </a>

    <div class="card soon sk8" aria-label="SK8, coming soon">
      <img class="art" src="/sk8-art.png" alt="">
      <span class="name"><span class="s">S</span><span class="k">K</span><span class="e">8</span></span>
      <p class="what">A tiny skateboarding game by Guy. Lacing up.</p>
      <span class="go">Coming soon</span>
    </div>
  </div>

  <footer>&copy; 2026 Oatmeal Morning</footer>
</main>
</body>
</html>
